id: skill-admin-dashboard
name: "Admin Dashboard"
description: "Admin panel layout \u2014 fixed sidebar nav, stats cards, data table, breadcrumbs, top header"
category: layout
scope: global
is_active: false
sort_order: 25
instructions: |
  OVERALL STRUCTURE (full-page layout):
    <div style="display:flex; min-height:100vh; background:#f1f5f9; font-family:'Inter',system-ui,sans-serif;">
      <!-- Sidebar -->
      <!-- Main content -->
    </div>
  
  SIDEBAR (fixed left, 240px):
    <aside style="width:240px; min-height:100vh; background:#1e293b; color:#e2e8f0; display:flex; flex-direction:column; flex-shrink:0; position:sticky; top:0; overflow-y:auto;">
      <!-- Logo -->
      <div style="padding:20px 16px; border-bottom:1px solid #334155;">
        <span style="font-size:1.2rem; font-weight:800; color:#f8fafc;">AdminPro</span>
      </div>
      <!-- Nav section -->
      <nav style="padding:12px 8px; flex:1;">
        <p style="font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:#64748b; font-weight:600; padding:8px 8px 4px;">Main</p>
        <!-- Active link -->
        <a href="#" style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;background:#334155;color:#f8fafc;text-decoration:none;font-size:14px;font-weight:500;margin-bottom:2px;">
          <span style="font-size:16px;">📊</span> Dashboard
        </a>
        <!-- Inactive link -->
        <a href="#" style="display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:#94a3b8;text-decoration:none;font-size:14px;font-weight:400;margin-bottom:2px;transition:all 0.15s;"
           onmouseover="this.style.background='#334155';this.style.color='#e2e8f0'"
           onmouseout="this.style.background='transparent';this.style.color='#94a3b8'">
          <span style="font-size:16px;">👥</span> Users
        </a>
      </nav>
      <!-- Bottom user card -->
      <div style="padding:16px; border-top:1px solid #334155; display:flex; align-items:center; gap:10px;">
        <div style="width:36px;height:36px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;">JD</div>
        <div style="overflow:hidden;">
          <p style="font-size:13px;font-weight:600;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">John Doe</p>
          <p style="font-size:11px;color:#64748b;">Admin</p>
        </div>
      </div>
    </aside>
  
  MAIN CONTENT AREA:
    <div style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
      <!-- Top header -->
      <header style="background:#fff; border-bottom:1px solid #e2e8f0; padding:0 24px; height:56px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;">
        <div>
          <span style="font-size:13px;color:#64748b;">Dashboard</span>
          <span style="font-size:13px;color:#cbd5e1;"> / </span>
          <span style="font-size:13px;color:#0f172a;font-weight:500;">Overview</span>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <button style="position:relative;background:none;border:none;cursor:pointer;font-size:18px;color:#64748b;">🔔<span style="position:absolute;top:0;right:0;width:8px;height:8px;background:#ef4444;border-radius:50%;border:2px solid #fff;"></span></button>
          <div style="width:32px;height:32px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;">JD</div>
        </div>
      </header>
      <!-- Page content -->
      <main style="flex:1; overflow-y:auto; padding:24px;">
  
  STATS CARDS (4-up grid):
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;">
      <div style="background:#fff;border-radius:12px;padding:20px;border:1px solid #e2e8f0;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <p style="font-size:12px;color:#64748b;font-weight:500;text-transform:uppercase;letter-spacing:.05em;">Total Users</p>
            <p style="font-size:1.75rem;font-weight:800;color:#0f172a;margin-top:4px;">24,521</p>
            <p style="font-size:12px;color:#22c55e;margin-top:4px;">↑ 12% from last month</p>
          </div>
          <div style="width:44px;height:44px;background:#eff6ff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;">👥</div>
        </div>
      </div>
    </div>
  
  DATA TABLE:
    <div style="background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;">
      <div style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
        <h3 style="font-size:15px;font-weight:700;color:#0f172a;">Recent Orders</h3>
        <button style="font-size:13px;color:#3b82f6;background:none;border:none;cursor:pointer;font-weight:500;">View all</button>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;">
          <thead style="background:#f8fafc;">
            <tr>
              <th style="padding:10px 20px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#64748b;white-space:nowrap;">Order ID</th>
            </tr>
          </thead>
          <tbody>
            <tr style="border-top:1px solid #f1f5f9;">
              <td style="padding:14px 20px;font-size:14px;color:#0f172a;">#ORD-001</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  
  STATUS BADGES:
    Active:   <span style="background:#dcfce7;color:#16a34a;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;">Active</span>
    Pending:  <span style="background:#fef9c3;color:#ca8a04;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;">Pending</span>
    Failed:   <span style="background:#fee2e2;color:#dc2626;font-size:11px;font-weight:600;padding:2px 10px;border-radius:20px;">Failed</span>
  
  RULES:
  - Sidebar always dark (#1e293b), main area light (#f1f5f9 background, #fff cards)
  - Stats cards: always 4-up grid with icon, number, trend indicator
  - Tables: subtle striping via border-top, never background-color alternating rows
  - Active nav item: bg #334155, text #f8fafc; inactive: text #94a3b8
  - Add at least 5 rows to the data table to look realistic
