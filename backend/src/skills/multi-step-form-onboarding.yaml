id: skill-multi-step-form-onboarding
name: "Multi-step Form / Onboarding"
description: "Step-by-step wizard UI \u2014 progress indicator, step navigation, validation states"
category: layout
scope: global
is_active: false
sort_order: 26
instructions: |
  STRUCTURE:
    <div style="min-height:100vh;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div style="background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);width:100%;max-width:560px;overflow:hidden;">
        <!-- Step header -->
        <!-- Step content -->
        <!-- Step footer (prev/next buttons) -->
      </div>
    </div>
  
  PROGRESS BAR (top of card):
    <div style="padding:24px 28px 20px; border-bottom:1px solid #f1f5f9;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <span style="font-size:13px;font-weight:600;color:#64748b;">Step 2 of 4</span>
        <span style="font-size:13px;color:#94a3b8;">Account Setup</span>
      </div>
      <!-- Bar -->
      <div style="height:4px;background:#e2e8f0;border-radius:4px;overflow:hidden;">
        <div style="height:100%;width:50%;background:#3b82f6;border-radius:4px;transition:width 0.4s ease;"></div>
      </div>
    </div>
  
  STEP INDICATORS (numbered circles):
    <div style="display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:32px;">
      <!-- Completed step -->
      <div style="width:36px;height:36px;border-radius:50%;background:#3b82f6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;">✓</div>
      <div style="height:2px;width:48px;background:#3b82f6;"></div>
      <!-- Active step -->
      <div style="width:36px;height:36px;border-radius:50%;background:#3b82f6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;box-shadow:0 0 0 4px #bfdbfe;">2</div>
      <div style="height:2px;width:48px;background:#e2e8f0;"></div>
      <!-- Upcoming step -->
      <div style="width:36px;height:36px;border-radius:50%;background:#f1f5f9;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;border:2px solid #e2e8f0;">3</div>
    </div>
  
  STEP CONTENT AREA:
    <div style="padding:28px 32px;">
      <h2 style="font-size:1.375rem;font-weight:700;color:#0f172a;margin-bottom:6px;">Create your account</h2>
      <p style="font-size:14px;color:#64748b;margin-bottom:24px;">Fill in your details to get started.</p>
      <!-- Form fields -->
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div>
          <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;">Full Name</label>
          <input style="width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;transition:border-color 0.15s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'"
                 placeholder="John Doe"/>
        </div>
        <!-- Error state -->
        <div>
          <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;">Email</label>
          <input style="width:100%;padding:10px 14px;border:2px solid #ef4444;border-radius:8px;font-size:14px;outline:none;background:#fff5f5;box-sizing:border-box;" value="bad-email"/>
          <p style="font-size:12px;color:#ef4444;margin-top:4px;">Please enter a valid email address.</p>
        </div>
      </div>
    </div>
  
  FOOTER (navigation buttons):
    <div style="padding:16px 32px 24px;display:flex;justify-content:space-between;border-top:1px solid #f1f5f9;">
      <button style="padding:10px 20px;border:2px solid #e2e8f0;border-radius:8px;background:#fff;color:#374151;font-size:14px;font-weight:600;cursor:pointer;">← Back</button>
      <button style="padding:10px 24px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:14px;font-weight:700;cursor:pointer;">Continue →</button>
    </div>
  
  SUMMARY STEP (review before submit):
    <div style="background:#f8fafc;border-radius:10px;padding:16px 20px;border:1px solid #e2e8f0;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e2e8f0;">
        <span style="font-size:13px;color:#64748b;">Name</span>
        <span style="font-size:13px;color:#0f172a;font-weight:500;">John Doe</span>
      </div>
    </div>
  
  RULES:
  - Always show current step number and total
  - Completed steps: filled blue circle with checkmark
  - Active step: blue circle with outer ring glow
  - Upcoming steps: gray outlined circle
  - Back button: outlined secondary; Next/Continue: filled primary
  - Final step submit button should be green or different color to signal completion
  - Show validation errors inline below the offending field
examples: |
  []
