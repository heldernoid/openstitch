id: skill-blog-editorial
name: "Blog / Editorial"
description: "Long-form readable layout \u2014 article typography, pull quotes, byline, tag chips, TOC"
category: layout
scope: global
is_active: true
sort_order: 29
instructions: |
  Load in <head>:
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  
  PALETTE:
    Background: #ffffff
    Body text:  #1a202c
    Muted:      #4a5568
    Border:     #e2e8f0
    Accent:     #3182ce (links)
    Header bg:  #ffffff
  
  ARTICLE PAGE STRUCTURE:
    <body style="background:#fff;font-family:'Inter',system-ui,sans-serif;color:#1a202c;">
      <!-- Site header / nav -->
      <div style="max-width:720px;margin:0 auto;padding:0 24px;">
        <!-- Article header -->
        <!-- Hero image -->
        <!-- Article body -->
        <!-- Author bio -->
        <!-- Related articles -->
      </div>
    </body>
  
  ARTICLE HEADER:
    <header style="padding:48px 0 32px;">
      <!-- Category tag -->
      <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#3182ce;">Technology</span>
      <h1 style="font-size:clamp(2rem,4vw,2.75rem);font-weight:700;line-height:1.2;letter-spacing:-0.02em;color:#1a202c;margin:12px 0 16px;font-family:'Merriweather',Georgia,serif;">
        Your Article Headline Goes Here and Can Span Two Lines Easily
      </h1>
      <p style="font-size:1.2rem;color:#4a5568;line-height:1.7;margin-bottom:24px;font-family:'Merriweather',Georgia,serif;font-style:italic;">
        This is the deck - a subheadline that expands on the main headline and sets up the article.
      </p>
      <!-- Byline -->
      <div style="display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;">
        <div style="width:40px;height:40px;border-radius:50%;background:#e2e8f0;overflow:hidden;flex-shrink:0;"></div>
        <div>
          <p style="font-size:14px;font-weight:600;color:#1a202c;">Author Name</p>
          <p style="font-size:13px;color:#718096;">March 31, 2026 · 8 min read</p>
        </div>
      </div>
    </header>
  
  BODY TYPOGRAPHY:
    <article style="font-family:'Merriweather',Georgia,serif;font-size:1.125rem;line-height:1.85;color:#2d3748;">
      <p style="margin-bottom:1.5em;">First paragraph of the article...</p>
      <h2 style="font-size:1.5rem;font-weight:700;color:#1a202c;margin:2em 0 0.75em;font-family:'Inter',sans-serif;letter-spacing:-0.01em;">Section Heading</h2>
      <p style="margin-bottom:1.5em;">Body copy...</p>
      <!-- Pull quote -->
      <blockquote style="border-left:4px solid #3182ce;padding:8px 0 8px 24px;margin:2em 0;color:#4a5568;">
        <p style="font-size:1.25rem;font-style:italic;line-height:1.6;margin:0;">"The pull quote stands out from the body copy and highlights a key insight."</p>
      </blockquote>
      <!-- Code block -->
      <pre style="background:#1a202c;color:#e2e8f0;border-radius:8px;padding:20px;overflow-x:auto;font-family:monospace;font-size:14px;line-height:1.6;margin:1.5em 0;"><code>const example = "code goes here"</code></pre>
    </article>
  
  TAGS:
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:24px 0;">
      <span style="background:#ebf8ff;color:#2b6cb0;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;">Design</span>
      <span style="background:#f0fff4;color:#276749;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;">Frontend</span>
    </div>
  
  AUTHOR BIO:
    <div style="border:1px solid #e2e8f0;border-radius:12px;padding:24px;display:flex;gap:20px;margin:48px 0;">
      <div style="width:64px;height:64px;border-radius:50%;background:#e2e8f0;flex-shrink:0;"></div>
      <div>
        <p style="font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:#718096;font-weight:600;margin-bottom:4px;">Written by</p>
        <h4 style="font-size:1.1rem;font-weight:700;color:#1a202c;margin-bottom:8px;">Author Name</h4>
        <p style="font-size:14px;color:#4a5568;line-height:1.6;">Short bio describing the author's background and expertise.</p>
      </div>
    </div>
  
  RULES:
  - Body text: Merriweather (serif) at 18px, line-height 1.85
  - Headlines: Inter (sans-serif), tight letter-spacing
  - Max-width 720px centered for readability
  - Images always full-width within the content column, border-radius:8px
  - Links: color:#3182ce, text-decoration:underline, no hover background
  - Code blocks: dark background, monospace, overflow-x:auto
  - Reading progress bar optional but nice (position:fixed, top:0, height:3px, background:#3182ce)
examples: |
  []
parameters: []
param_values: {}
