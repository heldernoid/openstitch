id: skill-auth-flows
name: "Auth Flows"
description: "Login, sign-up, and forgot-password pages \u2014 clean centered card layout with social auth"
category: layout
scope: global
is_active: false
sort_order: 27
instructions: |
  GENERAL STRUCTURE (all auth pages):
    <div style="min-height:100vh;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px;">
      <div style="background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.08);width:100%;max-width:420px;padding:40px;">
        <!-- Logo -->
        <!-- Heading -->
        <!-- Social auth buttons -->
        <!-- Divider "or" -->
        <!-- Form fields -->
        <!-- Submit button -->
        <!-- Footer link (sign up / sign in / back) -->
      </div>
    </div>
  
  LOGO:
    <div style="text-align:center;margin-bottom:28px;">
      <div style="width:48px;height:48px;background:#3b82f6;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;color:#fff;font-weight:900;">A</div>
      <h1 style="font-size:1.5rem;font-weight:800;color:#0f172a;">Welcome back</h1>
      <p style="font-size:14px;color:#64748b;margin-top:6px;">Sign in to your account</p>
    </div>
  
  SOCIAL BUTTONS:
    <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px;">
      <button style="display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border:2px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:#374151;width:100%;transition:border-color .15s;"
              onmouseover="this.style.borderColor='#94a3b8'" onmouseout="this.style.borderColor='#e2e8f0'">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <button style="display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border:2px solid #e2e8f0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:#374151;width:100%;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Continue with Facebook
      </button>
    </div>
  
  DIVIDER:
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
      <div style="flex:1;height:1px;background:#e2e8f0;"></div>
      <span style="font-size:13px;color:#94a3b8;font-weight:500;">or</span>
      <div style="flex:1;height:1px;background:#e2e8f0;"></div>
    </div>
  
  FORM:
    <form style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <label style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;">Email address</label>
        <input type="email" placeholder="you@example.com"
               style="width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;"
               onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'"/>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <label style="font-size:13px;font-weight:600;color:#374151;">Password</label>
          <a href="#" style="font-size:12px;color:#3b82f6;text-decoration:none;font-weight:500;">Forgot password?</a>
        </div>
        <input type="password" placeholder="••••••••"
               style="width:100%;padding:11px 14px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;box-sizing:border-box;"
               onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'"/>
      </div>
      <button type="submit" style="width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;">Sign in</button>
    </form>
  
  FOOTER LINK:
    <p style="text-align:center;font-size:13px;color:#64748b;margin-top:20px;">
      Don't have an account? <a href="#" style="color:#3b82f6;font-weight:600;text-decoration:none;">Sign up free</a>
    </p>
  
  RULES:
  - Center card on full-height page (flexbox align center)
  - Social buttons come BEFORE the form, not after
  - "Forgot password?" link should be right-aligned next to the password label
  - Submit button: full width, primary color, bold text
  - Include both "Sign in" and "Sign up" variants in multi-screen apps
  - Error state: red border + red message below input field
