id: skill-rtl-support
name: "RTL Support"
description: "Right-to-left layout support \u2014 Arabic, Hebrew, Persian friendly, mirrored flex/grid directions"
category: layout
scope: global
is_active: false
sort_order: 31
instructions: |
  SETUP:
    <html lang="ar" dir="rtl">  <!-- or lang="he", lang="fa" -->
    <head>
      <!-- Arabic font (Noto Naskh Arabic or Cairo) -->
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet"/>
      <style>
        body {
          font-family: 'Cairo', 'Noto Naskh Arabic', 'Arial', sans-serif;
          direction: rtl;
          text-align: right;
        }
        /* Mirror padding/margin for RTL */
        .rtl-flip { transform: scaleX(-1); } /* flip arrow icons */
      </style>
    </head>
  
  KEY CSS RULES FOR RTL:
    /* Logical properties automatically flip in RTL */
    margin-inline-start: 16px;  /* = margin-right in RTL, margin-left in LTR */
    margin-inline-end: 8px;     /* = margin-left in RTL */
    padding-inline-start: 16px;
    border-inline-start: 3px solid blue; /* left border in LTR, right in RTL */
  
    /* Flex rows automatically reverse for RTL - no manual change needed */
    /* BUT: if you used margin-left for gap, use gap: instead */
  
  NAVBAR (RTL):
    <nav dir="rtl" style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#fff;border-bottom:1px solid #e2e8f0;">
      <div style="display:flex;align-items:center;gap:12px;">
        <!-- Logo on right side in RTL -->
        <span style="font-size:1.25rem;font-weight:700;">اسم التطبيق</span>
      </div>
      <div style="display:flex;gap:24px;">
        <a href="#" style="color:#374151;text-decoration:none;font-weight:500;">الرئيسية</a>
        <a href="#" style="color:#374151;text-decoration:none;font-weight:500;">المنتجات</a>
      </div>
    </nav>
  
  SIDEBAR (RTL - appears on RIGHT side):
    <div style="display:flex;direction:rtl;">
      <aside style="width:240px;min-height:100vh;background:#1e293b;flex-shrink:0;">
        <!-- sidebar content, right side -->
      </aside>
      <main style="flex:1;">...</main>
    </div>
  
  FORM LABELS (RTL):
    <div dir="rtl" style="margin-bottom:16px;">
      <label style="display:block;font-size:14px;font-weight:600;color:#374151;margin-bottom:6px;text-align:right;">البريد الإلكتروني</label>
      <input type="email" placeholder="أدخل بريدك الإلكتروني"
             style="width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:8px;text-align:right;direction:rtl;box-sizing:border-box;font-family:'Cairo',sans-serif;"/>
    </div>
  
  BREADCRUMB (reversed order):
    <nav dir="rtl" style="font-size:13px;color:#6b7280;">
      <a href="#">الرئيسية</a>
      <span style="margin:0 8px;">←</span>   <!-- arrow points LTR for "back" -->
      <a href="#">الفئة</a>
      <span style="margin:0 8px;">←</span>
      <span>الصفحة الحالية</span>
    </nav>
  
  ICON MIRRORING (flip directional icons in RTL):
    <!-- Flip: chevron-right, arrow-right, back arrow, send icons -->
    <svg style="transform:scaleX(-1);" .../>  <!-- flip in RTL -->
    <!-- Do NOT flip: logos, clocks, checkmarks, close X, warning triangles -->
  
  NUMBER/DATE DIRECTION:
    <!-- Wrap numbers in LTR span even inside RTL context -->
    <span dir="ltr" style="display:inline-block;">$1,234.56</span>
    <span dir="ltr" style="display:inline-block;">31/03/2026</span>
  
  RULES:
  - Set dir="rtl" on <html> element (not just body)
  - Use logical CSS properties (margin-inline-start) instead of margin-left/right where possible
  - Flex row direction automatically mirrors - don't manually set flex-direction:row-reverse
  - Inputs with text: always set direction:rtl AND text-align:right explicitly (browsers vary)
  - Numbers, prices, dates, phone numbers: wrap in dir="ltr" span
  - Directional icons (arrows, chevrons) need transform:scaleX(-1) in RTL
  - Test font: Cairo is clean and supports Arabic + Latin
